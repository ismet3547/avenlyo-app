name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm smoke:api
  database:
    name: Database isolation and runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: pnpm db:reset
      - run: pnpm db:test
      - name: Set disposable local connection
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-local.json"
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/supabase-local.json`,'utf8'));
          if(c.API_URL!=='http://127.0.0.1:55321') throw new Error('Unexpected local stack');
          const publicKey=c.PUBLISHABLE_KEY||c.ANON_KEY;
          if(!publicKey||!c.SERVICE_ROLE_KEY) throw new Error('Local keys unavailable');
          appendFileSync(process.env.GITHUB_ENV,`SUPABASE_URL=${c.API_URL}\nSUPABASE_PUBLISHABLE_KEY=${publicKey}\nSUPABASE_SERVICE_ROLE_KEY=${c.SERVICE_ROLE_KEY}\n`);
          JS
      - run: pnpm test:acceptance
      - if: always()
        run: supabase stop --no-backup
